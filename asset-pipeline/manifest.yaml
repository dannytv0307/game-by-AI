# Danh sách asset của game. Mỗi id là duy nhất; output được đặt theo id.
# Loại:
#   anchor     – tấm tham chiếu nhân vật/thực thể -> refs/<entity>.png (gen TRƯỚC mọi asset khác của entity)
#   style      – style tile tổng -> refs/_style_hd.png (gen ĐẦU TIÊN, gửi kèm mọi ảnh)
#   sprite     – 1 hình tĩnh, tách nền, pivot ở chân
#   anim       – dải N frame trên cùng 1 ảnh -> sprite sheet ngang, pivot đáy-giữa
#   tileset    – lưới tile vuông `tile` px, cols x rows
#   background – ảnh nền (không tách nền), kích thước width x height px
#   music      – Lyria, theo zone
#   voice      – Gemini TTS, theo entity
#   sfx        – tổng hợp bằng code (không gọi API), preset trong pipeline/sfx.py

assets:
  # ---------- Âm thanh ----------
  - { id: music_village,  type: music, zone: ruined_village, prompt: "exploration theme",       out: Music/music_village.wav }
  - { id: music_hellgate, type: music, zone: hell_gate,      prompt: "combat theme",            out: Music/music_hellgate.wav }
  - { id: music_boss,     type: music, zone: hell_gate,      prompt: "epic boss battle theme, heavier choir and organ, relentless", out: Music/music_boss.wav }

  - { id: vo_hero_transform, type: voice, entity: hero_demon_hd, line: "Blood... of the abyss... AWAKEN!",            out: Voice/vo_hero_transform.wav }
  - { id: vo_hero_intro,     type: voice, entity: hero_hd,      line: "They took everything. I'll send them back to hell.", out: Voice/vo_hero_intro.wav }
  - { id: vo_boss_taunt,     type: voice, entity: demon_knight_hd, line: "You carry our blood, half-breed. Kneel.",   out: Voice/vo_boss_taunt.wav }

  - { id: sfx_slash,     type: sfx, preset: slash,     out: SFX/sfx_slash.wav }
  - { id: sfx_hit,       type: sfx, preset: hit,       out: SFX/sfx_hit.wav }
  - { id: sfx_jump,      type: sfx, preset: jump,      out: SFX/sfx_jump.wav }
  - { id: sfx_land,      type: sfx, preset: land,      out: SFX/sfx_land.wav }
  - { id: sfx_hurt,      type: sfx, preset: hurt,      out: SFX/sfx_hurt.wav }
  - { id: sfx_rage_full, type: sfx, preset: rage_full, out: SFX/sfx_rage_full.wav }
  - { id: sfx_transform, type: sfx, preset: transform, out: SFX/sfx_transform.wav }
  - { id: sfx_enemy_die, type: sfx, preset: enemy_die, out: SFX/sfx_enemy_die.wav }

  # ================= ĐỒ HỌA HD (style: hd) =================
  # Thứ tự: style_tile_hd -> hero_hd_anchor -> hero_demon_hd_anchor -> các asset còn lại.
  - id: style_tile_hd
    type: style
    style: hd
    prompt: >
      A style guide sheet: on the left a broad-shouldered ronin demon hunter in a tattered black haori holding a long
      nodachi, next to a horned oni silhouette with a cracked hannya half-mask; in the middle a fragment of ruined
      architecture where a gothic stone arch merges with a broken Japanese shrine roof and a fallen torii; on the right a
      stone lantern with a spectral violet ghost flame and drifting ember-red sparks. All sharing one consistent very dark
      palette and the same cold violet moonlight rim lighting. Flat near-black background.

  - { id: hero_hd_anchor,       type: anchor, style: hd, entity: hero_hd }
  - { id: hero_demon_hd_anchor, type: anchor, style: hd, entity: hero_demon_hd }

  - id: hero_hd_parts
    type: parts
    style: hd
    entity: hero_hd
    prompt: >
      Character cut-out rig parts sheet for 2D skeletal animation: the same character disassembled into separate
      body parts laid out apart from each other with generous empty space between every part, nothing touching:
      head with hair, torso with mantle, upper arm left, forearm with hand left, upper arm right, forearm with hand right,
      thigh left, shin with boot left, thigh right, shin with boot right, mantle tail cloth, greatsword.
      Each part drawn complete including the hidden overlapping area at joints, side view facing right.
    out: Characters/HeroHD/hero_hd_parts.png

  - id: hero_hd_idle
    type: anim
    style: hd
    entity: hero_hd
    frames: 4
    action: tense idle stance, greatsword held low in the right hand dragging its tip near the ground, mantle stirring, smoke wisps from the black veins
    out: Characters/HeroHD/hero_hd_idle.png

  - id: hero_hd_attack_pose
    type: sprite
    height_px: 400
    style: hd
    entity: hero_hd
    action: dynamic mid-swing key pose of a brutal horizontal greatsword slash, mantle whipping, a faint pale slash trail
    out: Characters/HeroHD/hero_hd_attack_pose.png

  - id: hero_hd_transform_pose
    type: sprite
    height_px: 430
    style: hd
    entity: hero_demon_hd
    action: >
      mid-transformation key pose: half of the body still human Kael, the left half tearing apart into the demon form,
      skin cracking with molten crimson light, horn bursting from the skull, screaming in agony, black ichor and embers
    out: Characters/HeroHD/hero_hd_transform_pose.png

  - id: hero_demon_hd_attack_pose
    type: sprite
    height_px: 540
    style: hd
    entity: hero_demon_hd
    action: monstrous overhead smash with the bone greatsword, crimson fire arc and black ichor spray, jaw split open roaring
    out: Characters/HeroDemonHD/hero_demon_hd_attack_pose.png

  - id: village_hd_bg
    type: background
    style: hd
    zone: ruined_village
    width: 1920
    height: 1080
    prompt: >
      side-scrolling game background, gothic ruined village street at night under a sickly moon, collapsed timber
      houses and a broken church bell tower, cold fog, distant fires, no characters, lower fifth of the image is a
      dark cobblestone ground plane suitable for characters to stand on
    out: Backgrounds/VillageHD/village_hd_bg.png

  # ----- HD: bổ sung để ráp thành màn chơi Level1_HD -----
  - { id: imp_hd_anchor,          type: anchor, style: hd, entity: imp_hd }
  - { id: hellhound_hd_anchor,    type: anchor, style: hd, entity: hellhound_hd }
  - { id: demon_knight_hd_anchor, type: anchor, style: hd, entity: demon_knight_hd }

  - id: hero_hd_run
    type: anim
    style: hd
    entity: hero_hd
    frames: 4
    action: running cycle with long strides, legs clearly in different positions in every frame, greatsword held low behind, mantle streaming back
    out: Characters/HeroHD/hero_hd_run.png
  - id: hero_hd_jump_pose
    type: sprite
    height_px: 330
    style: hd
    entity: hero_hd
    action: airborne mid-jump pose, knees tucked, mantle flaring upward, greatsword held back
    out: Characters/HeroHD/hero_hd_jump_pose.png
  - id: hero_hd_hurt_pose
    type: sprite
    style: hd
    entity: hero_hd
    action: staggering backwards after being struck, recoiling in pain, one hand clutching the chest
    out: Characters/HeroHD/hero_hd_hurt_pose.png
  - id: hero_demon_hd_idle_pose
    type: sprite
    height_px: 420
    style: hd
    entity: hero_demon_hd
    action: menacing hunched combat stance, bone greatsword dragging, claws twitching, embers and smoke rising
    out: Characters/HeroDemonHD/hero_demon_hd_idle_pose.png

  - id: imp_hd_run_pose
    type: sprite
    style: hd
    entity: imp_hd
    action: skittering forward on all fours, claws reaching ahead
    out: Enemies/ImpHD/imp_hd_run_pose.png
  - id: imp_hd_attack_pose
    type: sprite
    height_px: 230
    style: hd
    entity: imp_hd
    action: leaping pounce with both claws raised to slash, wings spread
    out: Enemies/ImpHD/imp_hd_attack_pose.png
  - id: hellhound_hd_run_pose
    type: sprite
    style: hd
    entity: hellhound_hd
    action: full-speed lunging gallop, jaws open, embers trailing from the mouth
    out: Enemies/HellhoundHD/hellhound_hd_run_pose.png
  - id: demon_knight_hd_idle_pose
    type: sprite
    style: hd
    entity: demon_knight_hd
    action: looming battle stance facing right, cleaver held low in one hand, violet fire leaking from the armour
    out: Enemies/DemonKnightHD/demon_knight_hd_idle_pose.png

  - id: village_hd_tiles
    type: tileset
    style: hd
    zone: ruined_village
    cols: 4
    rows: 2
    prompt: >
      Top row: two dark wet cobblestone ground tiles with a worn top edge (left one cracked, right one with moss),
      then two charred wooden plank bridge tiles. Bottom row: two dark packed earth and rubble fill tiles, then two
      broken masonry rubble decoration pieces.
    out: Tiles/VillageHD/village_hd_tiles.png

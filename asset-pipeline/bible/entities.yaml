# Mô tả các thực thể (nhân vật, quái, đạo cụ, vùng đất).
# Anchor = ảnh tham chiếu đã duyệt tại refs/<id>.png. Khi file đó tồn tại, MỌI asset của thực thể đó
# đều gửi kèm anchor cho mô hình để giữ đúng ngoại hình. Đổi mô tả sau khi đã có anchor => phải gen lại anchor.

entities:
  # ---------- Đồ họa HD ----------
  hero_hd:
    name: Kael
    kind: character
    style: hd
    height_px: 360
    description: >
      Battle-hardened human swordsman around 28, broad shoulders and a powerful athletic warrior build with thick
      muscular forearms, angular face with square jaw, short stubble and a vertical scar through the right eyebrow,
      deep-set eyes with a faint dried-blood red glint. Long black hair tied in a half-up ronin knot, loose strands over
      the face. Layered black gothic leather armour with iron rivets under a long tattered black haori with burnt hem,
      one dark-steel pauldron on the left shoulder engraved with a faded sigil, cloth sash hung with paper talismans,
      dark hakama tucked into heavy leather boots, bandaged forearms. Black demon-blood veins crack like porcelain from
      the left hand up to the shoulder and neck, trailing faint ink-like smoke. Carries a very long single-edged nodachi
      with a nicked blackened blade and dried-blood crimson hilt wrap, its black scabbard covered in paper seals.
      Stern, controlled, restrained fury.
    voice: { name: Charon, direction: "low, rough, stern seasoned warrior, restrained anger" }

  hero_demon_hd:
    name: Kael (Demon Form)
    kind: character
    style: hd
    height_px: 420
    based_on: hero_hd
    description: >
      Kael transformed into a towering oni, larger and more massively muscular than his human form, hunched and
      predatory. Charred black skin split by deep cracks glowing with molten blood-crimson fire. Two asymmetric oni
      horns, one great curved horn and one broken stump. The left half of his face has cracked into a bone hannya mask
      with a mouth torn to the ear and needle teeth, while the right half is still recognisably Kael's face. Too many
      knuckles on long clawed fingers. The haori has become living shadow and drifting ink-like embers. The nodachi has
      fused with the left arm into a jagged black bone blade with a crimson burning edge. Keeps the left steel pauldron
      fused into the flesh and the crimson hilt cloth. Dread-inducing, never heroic.
    voice: { name: Charon, direction: "same man, inhuman, layered growl and whisper", fx: demon }

  imp_hd:
    name: Imp
    kind: enemy
    style: hd
    height_px: 200
    description: >
      Small emaciated demon the size of a child, ash-grey leathery skin stretched over visible ribs, cracked with faint
      ember-red veins, oversized bony clawed hands, torn membranous bat wings, one broken horn, a wide lipless grin of
      needle teeth, milky white blind eyes. Hunched, twitchy, feral.

  hellhound_hd:
    name: Hellhound
    kind: enemy
    style: hd
    height_px: 230
    description: >
      Gaunt skeletal demon hound, patchy charcoal hide torn open to show raw dark-red muscle and blackened ribs with
      embers smouldering inside the ribcage, elongated skull-like snout dripping black saliva, a ridge of bone spikes
      along the spine, burning ember eyes.

  demon_knight_hd:
    name: Fallen Demon Knight
    kind: boss
    style: hd
    height_px: 560
    description: >
      Towering fallen knight corrupted by demons, corroded black-iron plate armour grown into rotting flesh, sickly
      violet hellfire leaking from the joints and visor slits, a massive horned great helm, a huge jagged butcher cleaver
      blade notched and stained, a tattered blood-red war banner on a broken pole strapped to the back. Ancient, heavy,
      oppressive.
    voice: { name: Fenrir, direction: "deep, ancient, contemptuous", fx: demon }

zones:
  ruined_village:
    description: >
      Burned human village at dusk, collapsed timber houses, cobblestone streets, broken church bell tower,
      embers drifting, cold blue night sky with a crimson glow on the horizon.
    music_mood: melancholic, sparse organ and choir, slow tempo around 80 BPM, sense of loss
  hell_gate:
    description: >
      Cracked black obsidian cliffs, rivers of lava, chained bone bridges, a giant demonic gate carved with runes
      glowing purple, ash falling.
    music_mood: aggressive, fast tempo around 150 BPM, pounding taiko and distorted bass, urgent
